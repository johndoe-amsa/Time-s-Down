<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#140d33">
<meta name="description" content="Time's Down — le jeu de mots à se passer entre amis.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time's Down">
<meta name="application-name" content="Time's Down">
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" id="apple-icon-link">
<title>Time's Down — Jeu de mots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #140d33;
    --bg2: #241657;
    --card: rgba(255,255,255,.055);
    --card-solid: #2c1d6b;
    --card2: rgba(255,255,255,.11);
    --accent: #ffd23f;
    --accent2: #ff9f1c;
    --good: #2ecc71;
    --bad: #ff5c7a;
    --neutral: #6c7bff;
    --text: #f6f3ff;
    --muted: #ada4dd;
    --line: rgba(255,255,255,.10);
    --radius: 22px;
    --radius-sm: 14px;
    --s1: 6px; --s2: 10px; --s3: 14px; --s4: 18px; --s5: 24px; --s6: 34px;
    --shadow: 0 16px 38px rgba(0,0,0,.45);
    --shadow-sm: 0 6px 16px rgba(0,0,0,.30);
    --font-display: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  *:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
  html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--text);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(60% 42% at 50% 0%, rgba(108,123,255,.34), transparent 70%),
      radial-gradient(48% 36% at 88% 8%, rgba(255,159,28,.16), transparent 70%),
      radial-gradient(70% 60% at 50% 100%, rgba(255,92,122,.14), transparent 72%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%);
    background-attachment: fixed;
  }
  #app {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding:
      calc(var(--s4) + env(safe-area-inset-top))
      calc(var(--s4) + env(safe-area-inset-right))
      calc(var(--s5) + env(safe-area-inset-bottom))
      calc(var(--s4) + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
  }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
  h1 { font-size: 1.9rem; margin: 0 0 var(--s1); letter-spacing: .3px; line-height: 1.12; }
  h2 { font-size: 1.5rem; margin: 0 0 var(--s3); line-height: 1.15; }
  h3 { font-size: 1.12rem; margin: 0 0 var(--s2); }
  p  { line-height: 1.5; color: var(--muted); margin: 0 0 var(--s3); }

  .logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 13vw, 3.4rem);
    line-height: 1;
    letter-spacing: .5px;
    margin: var(--s4) 0 var(--s1);
    background: linear-gradient(180deg, #fff 10%, var(--accent) 55%, var(--accent2));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 16px rgba(255,159,28,.35));
  }
  .tagline {
    color: var(--accent); font-weight: 600; margin: 0 0 var(--s5);
    letter-spacing: .6px; font-size: .98rem;
  }

  .screen { animation: screenIn .26s cubic-bezier(0.16, 1, 0.3, 1); flex: 1; display: flex; flex-direction: column; }
  @keyframes screenIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  .center { text-align: center; }
  .spacer { flex: 1; min-height: var(--s3); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: var(--s5);
    margin: 0 0 var(--s4);
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }

  label { display: block; font-size: .82rem; color: var(--muted); margin: 0 0 var(--s1); font-weight: 600; letter-spacing: .3px; }
  input, select, textarea {
    width: 100%;
    padding: 15px 16px;
    font-size: 16px;
    font-family: var(--font-body);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--line);
    background: rgba(0,0,0,.28);
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  button, a, input, select, textarea, [role="button"], .clickable {
    touch-action: manipulation;
  }
  .press:active { transform: scale(0.97); transition: transform 80ms; }
  input::placeholder { color: var(--muted); opacity: .7; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,210,63,.18); }

  .row { display: flex; gap: var(--s2); }
  .row > * { flex: 1; }

  .stepper { display: flex; align-items: center; gap: var(--s3); }
  .stepper button {
    width: 52px; height: 52px; font-size: 1.5rem; padding: 0;
    flex: none; border-radius: 14px; min-height: 0;
  }
  .stepper .val {
    font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
    min-width: 52px; text-align: center;
  }

  button {
    font-family: var(--font-display);
    cursor: pointer;
    border: none;
    border-radius: 16px;
    padding: 15px 18px;
    font-size: 1.06rem;
    font-weight: 600;
    letter-spacing: .3px;
    color: #2a1850;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: linear-gradient(180deg, #ffe487, var(--accent) 52%, var(--accent2));
    width: 100%;
    min-height: 56px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    box-shadow: 0 5px 0 rgba(0,0,0,.22), var(--shadow-sm);
    transition: transform .07s ease, box-shadow .07s ease, filter .15s ease, opacity .15s ease;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.22), var(--shadow-sm); }
  button:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; transform: none; }
  button.secondary {
    background: var(--card2); color: var(--text);
    box-shadow: var(--shadow-sm); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  button.secondary:active { transform: translateY(2px); }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--line); box-shadow: none;
  }
  button.ghost:active { transform: translateY(2px); }
  button.good    { background: linear-gradient(180deg, #57e08f, var(--good) 55%, #20a85a); color: #06351c; }
  button.bad     { background: linear-gradient(180deg, #ff86a0, var(--bad) 55%, #e23a5d); color: #4a0a1c; }
  button.neutral { background: linear-gradient(180deg, #8e9bff, var(--neutral) 55%, #4a5bdc); color: #fff; }
  button.small {
    width: auto; padding: 10px 16px; font-size: .9rem; min-height: 44px;
    border-radius: 12px; box-shadow: none;
  }
  .btn-stack > * { margin-top: var(--s3); }
  .btn-stack > *:first-child { margin-top: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: var(--s1);
    padding: 7px 14px; border-radius: 999px;
    font-family: var(--font-display);
    font-size: .78rem; font-weight: 600; letter-spacing: .6px;
    text-transform: uppercase;
    background: var(--card2); color: var(--text);
    border: 1px solid var(--line);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; box-shadow: 0 0 0 3px rgba(255,255,255,.08); }

  .player-line {
    display: flex; align-items: center; gap: var(--s2);
    padding: 13px 14px; background: rgba(0,0,0,.22);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm); margin-bottom: var(--s2);
  }
  .player-line .name { flex: 1; font-weight: 600; }
  .player-line button { width: auto; flex: none; }
  .x-btn {
    background: transparent; color: var(--bad);
    width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 44px; box-shadow: none; border-radius: 12px;
  }
  .x-btn:active { transform: scale(.9); }

  .team-block { margin-bottom: var(--s3); }
  .team-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
  .team-head input { font-family: var(--font-display); font-weight: 600; }
  .team-members { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 7px 13px; border-radius: 999px; font-size: .88rem;
    background: var(--card2); border: 1px solid var(--line); font-weight: 600;
  }

  .big-num {
    font-family: var(--font-display);
    font-size: 4.2rem; font-weight: 700; line-height: 1;
    text-shadow: 0 6px 22px rgba(255,210,63,.32);
  }

  .timer-wrap {
    position: relative; width: 184px; height: 184px;
    margin: var(--s3) auto var(--s2);
    display: grid; place-items: center;
  }
  .timer-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .timer-track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 11; }
  .timer-prog {
    fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round;
    stroke-dasharray: 339.292; stroke-dashoffset: 0;
    transition: stroke-dashoffset .9s linear, stroke .3s ease;
    filter: drop-shadow(0 0 8px rgba(255,210,63,.55));
  }
  .timer-num {
    font-family: var(--font-display); font-weight: 700;
    font-size: 3.6rem; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .timer-wrap.low .timer-prog { stroke: var(--bad); filter: drop-shadow(0 0 9px rgba(255,92,122,.6)); }
  .timer-wrap.low .timer-num { color: var(--bad); animation: pulse .85s infinite; }
  @keyframes pulse { 50% { opacity: .42; } }

  .word-box {
    position: relative; overflow: hidden;
    background: linear-gradient(165deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.16);
    border-radius: var(--radius);
    padding: 44px 22px;
    text-align: center;
    margin: var(--s3) 0;
    min-height: 168px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .word-box::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(70% 60% at 50% 0%, rgba(255,210,63,.16), transparent 70%);
    pointer-events: none;
  }
  .word-box .word {
    font-family: var(--font-display); font-weight: 600;
    font-size: clamp(1.7rem, 8.5vw, 2.6rem);
    line-height: 1.15; word-break: break-word;
    animation: wordIn .24s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes wordIn { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }

  .stat-row { display: flex; gap: var(--s2); margin-bottom: var(--s2); }
  .stat {
    flex: 1; background: rgba(0,0,0,.24); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 12px 8px; text-align: center;
  }
  .stat .k { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .stat .v { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; margin-top: 2px; }

  .recap-item {
    display: flex; align-items: center; gap: var(--s2);
    padding: 13px 15px; border-radius: var(--radius-sm);
    background: rgba(0,0,0,.22); border: 1px solid var(--line);
    margin-bottom: var(--s2);
  }
  .recap-item .w { flex: 1; font-weight: 600; }
  .recap-item.removed { opacity: .6; }
  .recap-item.removed .w { text-decoration: line-through; color: var(--muted); }

  .score-table { width: 100%; border-collapse: collapse; margin-top: var(--s1); }
  .score-table td { padding: 14px 8px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table .s { text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; }

  .winner-banner {
    text-align: center; padding: 28px 22px; border-radius: var(--radius);
    background: linear-gradient(165deg, #ffe487, var(--accent) 55%, var(--accent2));
    color: #3a2400; font-family: var(--font-display); font-weight: 700;
    font-size: 1.55rem; margin-bottom: var(--s4);
    box-shadow: 0 16px 40px rgba(255,159,28,.4);
    animation: pop .35s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }

  .hint { font-size: .9rem; color: var(--muted); margin: var(--s2) 0 0; line-height: 1.45; }
  .footer-note { text-align: center; color: var(--muted); font-size: .78rem; margin-top: auto; padding-top: var(--s4); opacity: .8; }
  .err { color: var(--bad); font-size: .9rem; margin: var(--s1) 0 0; min-height: 1.1em; font-weight: 600; }

  @media (max-height: 700px) {
    .big-num { font-size: 3.2rem; }
    .timer-wrap { width: 150px; height: 150px; }
    .timer-num { font-size: 3rem; }
    .word-box { min-height: 130px; padding: 30px 18px; }
    .logo { margin-top: var(--s2); }
  }
  @media (min-width: 768px) {
    #app {
      max-width: 600px;
      padding-left: calc(32px + env(safe-area-inset-left));
      padding-right: calc(32px + env(safe-area-inset-right));
    }
    h1 { font-size: 2.2rem; }
    .logo { font-size: 3.4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   Time's Down — jeu de mots local (un seul appareil)
   3 manches : description libre, un seul mot, mime.
   ============================================================ */

const STORAGE_KEY = "timesdown_state_v1";
const TEAM_COLORS = ["#ff5c7a", "#6c7bff", "#2ecc71", "#ffd23f", "#ff9f43", "#26d0ce"];
function roundDef(i) { return S.rounds[i] || { name: "Manche " + (i + 1) }; }
function roundCount() { return S.rounds.length; }

// Banque de secours : pioche aléatoire si un joueur sèche.
const WORD_BANK = [
  "Tour Eiffel", "Astérix", "Pizza", "Licorne", "Napoléon", "Guitare",
  "Volcan", "Spaghetti", "Pingouin", "Boomerang", "Dracula", "Croissant",
  "Pyramide", "Aspirateur", "Cendrillon", "Sirène", "Tournesol", "Robot",
  "Yéti", "Boussole", "Tarzan", "Caméléon", "Parachute", "Mojito",
  "Sorcière", "Hamster", "Tornade", "Toboggan", "Pinocchio", "Méduse",
  "Trampoline", "Vampire", "Accordéon", "Fantôme", "Kangourou", "Igloo",
  "Mousquetaire", "Escargot", "Cactus", "Pirate", "Marmotte", "Boomerang",
  "Lutin", "Hippopotame", "Phare", "Dinosaure", "Brouette", "Karaoké",
  "Chevalier", "Flamant rose", "Montgolfière", "Cornichon", "Squelette",
  "Trésor", "Loup-garou", "Saxophone", "Tortue", "Aimant", "Épouvantail",
  "Catapulte", "Lasagne", "Caravane", "Hérisson", "Bibliothèque", "Confetti",
  "Mammouth", "Funambule", "Boule à neige", "Perroquet", "Sous-marin", "Gargouille",
];

/* ---------- State ---------- */
let S = null;

function freshState() {
  return {
    screen: "setup",
    players: [],            // [{id, name}]
    nbTeams: 2,
    teams: [],              // [{id, name, color, playerIds:[], score, descPtr}]
    wordsPerPlayer: 5,
    turnSeconds: 30,
    rounds: [{ name: "Description libre" }, { name: "Un seul mot" }, { name: "Mime" }],
    words: [],              // [{id, text}]
    // word entry
    entryIndex: 0,          // index into players for the entry gate
    // round / turn
    roundIndex: 0,
    roundRemaining: [],     // wordIds still to guess this round
    pile: [],               // shuffled working order for current turn
    currentWordId: null,
    turnFound: [],           // wordIds found during the current turn
    snapshots: [],           // undo stack (JSON strings) for current turn
    teamPos: 0,              // index into teams = team currently playing
    timeLeft: 0,
    deadline: 0,             // epoch ms; drift-free timer reference
    paused: false,
    roundJustFinished: false,
    tiebreak: false,
    stats: { byPlayer: {}, byRound: [], bestTurn: null },
  };
}

/* ---------- Persistence ---------- */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s && typeof s === "object" && s.screen) {
      if (!Array.isArray(s.rounds) || !s.rounds.length) {
        s.rounds = [{ name: "Description libre" }, { name: "Un seul mot" }, { name: "Mime" }];
      } else if (typeof s.rounds[0] === "number") {
        const OLD = ["Description libre", "Un seul mot", "Mime", "Son & bruitage", "Un mot + un geste"];
        s.rounds = s.rounds.map(i => ({ name: OLD[i] || "Manche" }));
      }
      if (typeof s.deadline !== "number") s.deadline = 0;
      if (!s.stats || typeof s.stats !== "object") s.stats = { byPlayer: {}, byRound: [], bestTurn: null };
      return s;
    }
  } catch (e) {}
  return null;
}
function clearSave() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

/* ---------- Helpers ---------- */
let _id = 1;
const uid = () => "i" + (_id++) + Date.now().toString(36);
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k === "html") n.innerHTML = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else if (props[k] !== false && props[k] != null) n.setAttribute(k, props[k]);
  }
  for (const kid of kids) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function icon(name, size) {
  size = size || 18;
  const i = document.createElement("i");
  i.setAttribute("data-lucide", name);
  i.style.cssText = "width:" + size + "px;height:" + size + "px;display:inline-flex;flex-shrink:0;pointer-events:none";
  return i;
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- Audio (Web Audio, no asset files) ---------- */
let actx = null;
function unlockAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function tone(kind) {
  try {
    if (!actx) return;
    const now = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    let f = 660, d = 0.09, type = "square", vol = 0.18;
    if (kind === "tick")       { f = 600; d = 0.06; }
    else if (kind === "go")    { f = 980; d = 0.28; type = "triangle"; vol = 0.22; }
    else if (kind === "found") { f = 880; d = 0.16; type = "triangle"; vol = 0.20; }
    else if (kind === "buzz")  { f = 150; d = 0.65; type = "sawtooth"; vol = 0.26; }
    o.type = type;
    o.frequency.value = f;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.start(now);
    o.stop(now + d + 0.02);
  } catch (e) {}
}

/* ---------- Wake Lock (keep screen on during a turn) ---------- */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S &&
      (S.screen === "playing" || S.screen === "countdown") && !S.paused && !wakeLock) {
    requestWakeLock();
  }
});
// Disable pinch-zoom on iOS Safari (ignores user-scalable=no).

function normWord(s) { return String(s).trim().toLowerCase().replace(/\s+/g, " "); }
function wordText(id) { const w = S.words.find(x => x.id === id); return w ? w.text : "?"; }
function playerName(id) { const p = S.players.find(x => x.id === id); return p ? p.name : "?"; }

/* ---------- Timer ---------- */
let timerHandle = null;
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function startTimer() {
  stopTimer();
  S.deadline = Date.now() + Math.max(0, S.timeLeft) * 1000;
  let lastSec = S.timeLeft;
  timerHandle = setInterval(() => {
    const msLeft = S.deadline - Date.now();
    if (msLeft <= 0) {
      S.timeLeft = 0;
      stopTimer();
      tone("buzz");
      vibrate([120, 60, 120]);
      endTurn(false);
      return;
    }
    const sec = Math.max(0, Math.ceil(msLeft / 1000));
    S.timeLeft = sec;
    if (sec !== lastSec) {
      lastSec = sec;
      save();
      if (sec <= 5) tone("tick");
    }
    updateTimerUI();
  }, 200);
}

const TIMER_CIRC = 339.292;   // 2·π·r with r=54
function updateTimerUI() {
  const num = $("#timer");
  if (num) num.textContent = S.timeLeft;
  const ring = $("#timer-ring");
  if (ring) {
    const frac = S.turnSeconds > 0
      ? Math.max(0, Math.min(1, S.timeLeft / S.turnSeconds)) : 0;
    ring.style.strokeDashoffset = (TIMER_CIRC * (1 - frac)).toFixed(2);
  }
  const wrap = $("#timer-wrap");
  if (wrap && wrap.classList) wrap.classList.toggle("low", S.timeLeft <= 10);
}

function buildTeams() {
  const nb = Math.max(2, Math.min(S.nbTeams, S.players.length));
  const order = shuffle(S.players.map(p => p.id));
  const teams = [];
  for (let i = 0; i < nb; i++) {

      id: uid(),

      color: TEAM_COLORS[i % TEAM_COLORS.length],
      playerIds: [],
      score: 0,
      descPtr: 0,

  order.forEach((pid, i) => teams[i % nb].playerIds.push(pid));
  S.teams = teams;
}

function stepper(labelTxt, value, min, max, onChange, step) {
  step = step || 1;
  let val = value;
  const wrap = el("div", { style: "margin-bottom:14px" });
  wrap.appendChild(el("label", {}, labelTxt));
  const valEl = el("span", { class: "val" }, String(val));
  const minus = el("button", { class: "secondary press" }, "−");
  const plus  = el("button", { class: "secondary press" }, "+");
  function set(nv) {
    nv = Math.max(min, Math.min(max, nv));
    if (nv === val) return;
    val = nv;
    valEl.textContent = String(val);
    minus.disabled = val <= min;
    plus.disabled  = val >= max;
    onChange(val);
  }
  minus.addEventListener("click", () => set(val - step));
  plus.addEventListener("click", () => set(val + step));
  minus.disabled = val <= min;
  plus.disabled  = val >= max;
  wrap.appendChild(el("div", { class: "stepper" },
    minus,
    valEl,
    plus,
    el("span", { class: "hint", style: "margin-left:10px" }, "(" + min + "–" + max + ")")
  ));
  return wrap;
}

/* ============================================================
   WORD ENTRY (private, pass the phone)
   ============================================================ */
let pendingEntry = null;     // values awaiting the player's confirmation
let entryStage = "edit";     // "edit" | "confirm"


function commitEntry(vals) {
  vals.forEach(v => S.words.push({ id: uid(), text: v }));
  pendingEntry = null;
  entryStage = "edit";
  S.entryIndex++;
  if (S.entryIndex >= S.players.length) startNewRound(0, true);
  else S.screen = "wordEntryForm";
  save();
  render();
}

function renderWordEntryForm() {
  const p = S.players[S.entryIndex];
  const c = el("div", { class: "screen" });
  c.appendChild(el("h2", {}, "À toi, " + p.name));
  c.appendChild(el("p", { class: "hint", style: "margin:-8px 0 16px" },
    "Joueur " + (S.entryIndex + 1) + " / " + S.players.length));

  /* ----- Confirmation step ----- */
  if (entryStage === "confirm" && pendingEntry) {
    c.appendChild(el("p", {}, "Relis bien tes mots avant de valider."));
    const list = el("div", { class: "card" });
    pendingEntry.forEach((w, i) => {
      list.appendChild(el("div", { class: "recap-item" },
        el("span", { class: "hint", style: "margin:0 10px 0 0" }, String(i + 1)),
        el("span", { class: "w" }, w)));
    });
    c.appendChild(list);
    c.appendChild(el("div", { class: "card btn-stack" },
      el("button", { class: "good", onclick: () => commitEntry(pendingEntry.slice()) }, icon("check", 17), " Confirmer"),
      el("button", { class: "ghost", onclick: () => { entryStage = "edit"; render(); } }, icon("arrow-left", 16), " Modifier")
    ));
    return c;
  }

  /* ----- Edit step ----- */

  const inputs = [];
  const card = el("div", { class: "card" });
  for (let i = 0; i < S.wordsPerPlayer; i++) {
    const inp = el("input", {
      type: "text", placeholder: "Mot " + (i + 1), autocomplete: "off",
      autocapitalize: "none", enterkeyhint: (i + 1 < S.wordsPerPlayer ? "next" : "done"),
      style: "margin-bottom:10px",
      value: (pendingEntry && pendingEntry[i]) || ""
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && inputs[i + 1]) inputs[i + 1].focus();
    });
    inputs.push(inp);
    card.appendChild(inp);
  }
  c.appendChild(card);
  const err = el("p", { class: "err" });
  c.appendChild(err);

  // Built-in word bank: fills the first empty field with an unused word.
  c.appendChild(el("button", {
    class: "ghost", style: "margin-bottom:10px",
    onclick: () => {
      const slot = inputs.find(i => !i.value.trim());
      if (!slot) { err.textContent = "Tous tes champs sont déjà remplis."; return; }
      const used = new Set([
        ...S.words.map(w => normWord(w.text)),
        ...inputs.map(i => normWord(i.value)).filter(Boolean),
      ]);
      const pool = WORD_BANK.filter(w => !used.has(normWord(w)));
      if (!pool.length) { err.textContent = "Plus de mots disponibles dans la banque."; return; }
      slot.value = pool[Math.floor(Math.random() * pool.length)];
      err.textContent = "";
    }
  }, icon("lightbulb", 16), " Suggérer un mot"));

  c.appendChild(el("button", {
    onclick: () => {
      const vals = inputs.map(i => i.value.trim()).filter(Boolean);
      if (vals.length < S.wordsPerPlayer) {
        err.textContent = "Remplis les " + S.wordsPerPlayer + " mots (" + vals.length + " saisis).";
        return;
      }
      const norm = vals.map(normWord);
      if (new Set(norm).size !== norm.length) {
        err.textContent = "Tu as écrit deux fois le même mot.";
        return;
      }
      const taken = new Set(S.words.map(w => normWord(w.text)));
      const clash = vals.find(v => taken.has(normWord(v)));
      if (clash) {
        err.textContent = "« " + clash + " » a déjà été proposé par un autre joueur. Change-le.";
        return;
      }
      pendingEntry = vals;
      entryStage = "confirm";
      render();
    }
  }, icon("check", 17), " Valider mes mots"));
  setTimeout(() => {
    const first = inputs.find(i => !i.value.trim()) || inputs[0];
    if (first && first.focus) first.focus();
  }, 30);
  return c;
}

function beginTurn() {
  unlockAudio();          // user gesture (JOUER tap) unlocks mobile audio
  requestWakeLock();
  S.pile = shuffle(S.roundRemaining.slice());
  S.currentWordId = S.pile.length ? S.pile.shift() : null;
  S.turnFound = [];
  S.snapshots = [];
  S.timeLeft = S.turnSeconds;
  S.paused = false;
  S.screen = "countdown";
  save();
  render();
}

let countdownHandle = null;
function stopCountdown() { if (countdownHandle) { clearInterval(countdownHandle); countdownHandle = null; } }
function startPlaying() {
  S.screen = "playing";
  save();
  render();
  startTimer();
}

function pauseTurn() {
  stopTimer();
  if (S.deadline) S.timeLeft = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000));
  S.paused = true;
  releaseWakeLock();
  save();
  render();
}
function resumeTurn() {
  unlockAudio();
  requestWakeLock();
  S.paused = false;
  save();
  render();
  startTimer();
}

function snapshot() {
  S.snapshots.push(JSON.stringify({
    pile: S.pile,
    cur: S.currentWordId,
    rem: S.roundRemaining,
    found: S.turnFound,
  }));
}
function serveNext() {
  S.currentWordId = S.pile.length ? S.pile.shift() : null;
}

function actionFound() {
  if (S.currentWordId == null) return;
  snapshot();
  const id = S.currentWordId;
  S.turnFound.push(id);
  S.roundRemaining = S.roundRemaining.filter(x => x !== id);
  currentTeam().score++;
  tone("found");
  vibrate(40);
  serveNext();
  save();
  if (S.currentWordId == null && S.roundRemaining.length === 0) {
    endTurn(true);          // round cleared
  } else {
    updatePlaying();
  }
}
function actionPass() {
  if (S.currentWordId == null) return;
  snapshot();
  S.pile.push(S.currentWordId);
  serveNext();
  save();
  updatePlaying();
}
function actionUndo() {
  if (!S.snapshots.length) return;
  const snap = JSON.parse(S.snapshots.pop());
  // recompute team score from snapshot's found count delta
  const delta = S.turnFound.length - snap.found.length;
  if (delta > 0) currentTeam().score -= delta;
  S.pile = snap.pile;
  S.currentWordId = snap.cur;
  S.roundRemaining = snap.rem;
  S.turnFound = snap.found;
  vibrate(20);
  save();
  updatePlaying();
}

function endTurn(roundCleared) {
  stopTimer();
  releaseWakeLock();
  S.paused = false;
  S.roundJustFinished = !!roundCleared;
  // an in-progress word that was never resolved stays available next turn
  S.screen = "turnRecap";
  save();
  render();
}

// A turn interrupted by a reload / screen lock: undo its points and free its words.
function rollbackTurn() {
  const t = S.teams && S.teams[S.teamPos];
  (S.turnFound || []).forEach(id => {
    if (t) t.score = Math.max(0, t.score - 1);
    if (!S.roundRemaining.includes(id)) S.roundRemaining.push(id);
  });
  S.turnFound = [];
  S.snapshots = [];
  S.pile = [];
  S.currentWordId = null;
  S.deadline = 0;
}

function renderPlaying() {
  const c = el("div", { class: "screen" });

  if (S.paused) {
    c.appendChild(el("div", { class: "spacer" }));
    c.appendChild(el("div", { class: "center" },
      el("div", { class: "big-num", style: "font-size:2rem;color:var(--muted);display:flex;align-items:center;gap:10px;justify-content:center" }, icon("pause", 28), " EN PAUSE")));
    c.appendChild(el("p", { class: "hint center" }, "Reste " + S.timeLeft + "s"));
    c.appendChild(el("div", { class: "spacer" }));
    c.appendChild(el("div", { class: "btn-stack" },
      el("button", { class: "good", onclick: resumeTurn }, icon("play", 18), " Reprendre"),
      el("button", { class: "ghost", onclick: () => endTurn(false) }, icon("square", 16), " Terminer le tour")
    ));
    return c;
  }

  c.appendChild(el("div", {
    id: "timer-wrap",
    class: "timer-wrap" + (S.timeLeft <= 10 ? " low" : ""),
    html:
      '<svg class="timer-svg" viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle class="timer-track" cx="60" cy="60" r="54"></circle>' +
      '<circle id="timer-ring" class="timer-prog" cx="60" cy="60" r="54"></circle>' +
      '</svg>' +
      '<div id="timer" class="timer-num">' + S.timeLeft + '</div>'
  }));

  c.appendChild(el("div", { class: "word-box" },
    el("span", { class: "word", id: "curword" },
      S.currentWordId != null ? wordText(S.currentWordId) : "—")
  ));

  c.appendChild(el("p", {
    id: "play-stat", class: "hint center",
    style: "margin:4px 0 0;font-size:.82rem"
  }, S.turnFound.length + " trouvé(s) · " + S.roundRemaining.length + " restants"));

  c.appendChild(el("div", { class: "spacer" }));

  c.appendChild(el("div", { class: "btn-stack" },
    el("button", { class: "good", id: "btn-found", onclick: actionFound }, icon("check", 22), " TROUVÉ !"),
    el("div", { class: "row" },
      el("button", { class: "neutral", id: "btn-pass", onclick: actionPass }, icon("rotate-cw", 18), " Passe"),
      el("button", { class: "secondary", id: "btn-undo", disabled: !S.snapshots.length, onclick: actionUndo }, icon("rotate-ccw", 16), " Annuler")
    ),
    el("button", { class: "ghost", style: "padding:10px", onclick: pauseTurn }, icon("pause", 20))
  ));
  return c;
}

function stat(k, v, id) {
  return el("div", { class: "stat" },
    el("div", { class: "k" }, k),
    el("div", { class: "v", id: id }, String(v)));
}

// Lightweight in-place update so the timer interval is never disrupted.
function updatePlaying() {
  const w = $("#curword");
  if (w) {
    w.textContent = S.currentWordId != null ? wordText(S.currentWordId) : "—";
    if (w.style) {                       // replay the pop animation on the new word
      w.style.animation = "none";
      void w.offsetWidth;
      w.style.animation = "";
    }
  }
  const ps = $("#play-stat"); if (ps) ps.textContent = S.turnFound.length + " trouvé(s) · " + S.roundRemaining.length + " restants";
  const u = $("#btn-undo");   if (u) u.disabled = !S.snapshots.length;
}

/* ============================================================
   TURN RECAP (with contestation)
   ============================================================ */
function renderTurnRecap() {
  const t = currentTeam();
  const c = el("div", { class: "screen" });
  c.appendChild(scoreboardHeader());
  c.appendChild(el("h2", {}, S.roundJustFinished ? "Manche terminée !" : "Fin du tour"));
  c.appendChild(el("p", {},
    el("span", { class: "pill" },
      el("span", { class: "dot", style: "background:" + t.color }),
      el("span", {}, t.name)),
    document.createTextNode("  a fait deviner " + S.turnFound.length + " mot(s).")
  ));

  const list = el("div", { class: "card" });
  if (!S.turnFound.length) {
    list.appendChild(el("p", { class: "hint", style: "margin:0" }, "Aucun mot trouvé ce tour."));
  }
  S.turnFound.forEach(id => {
    const removed = S._removed && S._removed.includes(id);
    const item = el("div", { class: "recap-item" + (removed ? " removed" : "") });
    item.appendChild(el("span", { class: "w" }, wordText(id)));
    item.appendChild(el("button", {
      class: (removed ? "secondary" : "ghost") + " small", style: "width:auto",
      onclick: () => {
        S._removed = S._removed || [];
        if (S._removed.includes(id)) S._removed = S._removed.filter(x => x !== id);
        else S._removed.push(id);
        save(); render();
      }
    }, removed ? "Remettre" : "Retirer"));
    list.appendChild(item);
  });
  c.appendChild(list);

  const removedCount = (S._removed || []).length;
  const netScore = t.score; // already reflects only confirmed; we adjust on continue
  c.appendChild(el("div", { class: "card" },
    el("p", { class: "hint", style: "margin:0 0 10px" },
      "Score validé ce tour : " + (S.turnFound.length - removedCount) +
      (removedCount ? "  (" + removedCount + " retiré(s))" : "")),
    el("button", { onclick: continueAfterRecap },
      document.createTextNode(S.roundJustFinished
        ? (S.roundIndex + 1 < roundCount() ? "Manche suivante " : "Voir les scores finaux ")
        : "Au tour suivant "),
      icon("arrow-right", 16))
  ));
  return c;
}

function continueAfterRecap() {
  const turnTeam = currentTeam();
  const turnDescriber = currentDescriberId();
  const removed = S._removed || [];

  // Stats: words actually validated this turn, credited to the describer.
  const net = S.turnFound.length - removed.length;
  if (net > 0) {
    if (!S.stats) S.stats = { byPlayer: {}, byRound: [], bestTurn: null };
    S.stats.byPlayer[turnDescriber] = (S.stats.byPlayer[turnDescriber] || 0) + net;
    S.stats.byRound[S.roundIndex] = (S.stats.byRound[S.roundIndex] || 0) + net;
    if (!S.stats.bestTurn || net > S.stats.bestTurn.count) {
      S.stats.bestTurn = { count: net, playerId: turnDescriber, round: S.roundIndex };
    }
  }

  // Apply contested removals: refund score, put words back into the round.
  removed.forEach(id => {
    turnTeam.score--;
    if (!S.roundRemaining.includes(id)) S.roundRemaining.push(id);
  });
  S._removed = [];

  // Advance rotation: this team's describer moves on, next team plays.
  turnTeam.descPtr = (turnTeam.descPtr + 1) % turnTeam.playerIds.length;
  S.teamPos = (S.teamPos + 1) % S.teams.length;

  const roundOver = S.roundRemaining.length === 0;
  if (roundOver) {
    if (S.roundIndex + 1 < roundCount()) {
      startNewRound(S.roundIndex + 1, false);
    } else {
      S.screen = "gameOver";
      stopTimer();
    }
  } else {
    S.screen = "turnReady";
  }
  save();
  render();
}

/* ============================================================
   GAME OVER
   ============================================================ */
// Sudden-death decider between teams still tied for first.
function startTiebreaker(tiedTeams) {
  S._origTeams = S._origTeams || S.teams;
  S._origRounds = S._origRounds || S.rounds.slice();
  S.teams = tiedTeams.map(t => Object.assign({}, t, { score: 0, descPtr: 0 }));
  S.tiebreak = true;
  S.rounds = [ S._origRounds && S._origRounds[0] ? S._origRounds[0] : { name: "Description libre" } ];
  S.roundIndex = 0;
  S.teamPos = 0;
  S.stats = { byPlayer: {}, byRound: [], bestTurn: null };
  startNewRound(0, true);
  save();
  render();
}

function renderStatsCard() {
  const st = S.stats || { byPlayer: {}, byRound: [], bestTurn: null };
  const card = el("div", { class: "card" });
  card.appendChild(el("h3", {}, "Stats"));

  const entries = Object.keys(st.byPlayer)
    .map(pid => ({ pid, n: st.byPlayer[pid] }))
    .sort((a, b) => b.n - a.n);

  if (!entries.length) {
    card.appendChild(el("p", { class: "hint", style: "margin:0" },
      "Aucun mot deviné. Pas de stats cette fois !"));
    return card;
  }

  const best = entries[0].n;
  const mvp = entries.filter(e => e.n === best).map(e => playerName(e.pid)).join(", ");
  card.appendChild(el("div", { class: "recap-item" },
    el("span", { class: "w" }, icon("award", 15), " MVP — " + mvp),
    el("span", { class: "pill" }, best + " mot" + (best > 1 ? "s" : ""))));

  if (st.bestTurn && st.bestTurn.count > 0) {
    card.appendChild(el("div", { class: "recap-item" },
      el("span", { class: "w" }, icon("flame", 15), " Meilleur tour — " + playerName(st.bestTurn.playerId)),
      el("span", { class: "pill" },
        st.bestTurn.count + " en « " + roundDef(st.bestTurn.round).name + " »")));
  }

  for (let i = 0; i < roundCount(); i++) {
    const n = (st.byRound && st.byRound[i]) || 0;
    card.appendChild(el("div", { class: "recap-item" },
      el("span", { class: "w" }, "Manche " + (i + 1) + " · " + roundDef(i).name),
      el("span", { class: "pill" }, String(n))));
  }

  if (entries.length > 1) {
    const list = el("div", { style: "margin-top:10px" });
    list.appendChild(el("p", { class: "hint", style: "margin:0 0 8px" },
      "Mots devinés par meneur :"));
    entries.forEach(e => list.appendChild(el("div", { class: "recap-item" },
      el("span", { class: "w" }, playerName(e.pid)),
      el("span", { class: "pill" }, String(e.n)))));
    card.appendChild(list);
  }
  return card;
}

function renderGameOver() {
  const ranked = S.teams.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter(t => t.score === top);
  const tie = winners.length > 1;
  const c = el("div", { class: "screen" });

  c.appendChild(el("div", { class: "winner-banner" },
    tie
      ? "Égalité ! " + winners.map(w => w.name).join(" & ")
      : "🏆 " + winners[0].name + " gagne !"));

  if (S.tiebreak) {
    c.appendChild(el("p", { class: "hint center", style: "margin:-10px 0 14px" },
      "Résultat de la manche de départage."));
  }

  const table = el("table", { class: "score-table" });
  ranked.forEach((t, i) => {
    table.appendChild(el("tr", {},
      el("td", { html: '<span class="dot" style="background:' + t.color + ';margin-right:8px"></span>' +
        (i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : "") + escapeHtml(t.name) }),
      el("td", { class: "s" }, String(t.score))
    ));
  });
  c.appendChild(el("div", { class: "card" }, el("h3", {}, "Scores finaux"), table));

  c.appendChild(renderStatsCard());

  const actions = el("div", { class: "card btn-stack" });
  if (tie) {
    actions.appendChild(el("button", { class: "neutral",
      onclick: () => startTiebreaker(winners) },
      icon("swords", 16), " Manche de départage"));
  }
  actions.appendChild(el("button", {
    onclick: () => {
      // replay with same players/teams, fresh words
      const keep = {
        players: S.players,
        teams: (S._origTeams || S.teams),
        nbTeams: S.nbTeams,
        wordsPerPlayer: S.wordsPerPlayer,
        turnSeconds: S.turnSeconds,
        rounds: (S._origRounds || S.rounds).slice(),
      };
      S = freshState();
      Object.assign(S, keep);
      S.teams.forEach(t => { t.score = 0; t.descPtr = 0; });
      S.words = []; S.entryIndex = 0; S.screen = "wordEntryForm";
      save(); render();
    }
  }, icon("refresh-cw", 16), " Rejouer (mêmes équipes)"));
  actions.appendChild(el("button", { class: "ghost", onclick: newGame }, icon("rotate-ccw", 16), " Nouvelle partie"));
  c.appendChild(actions);
  return c;
}

/* ============================================================
   RESUME / NEW GAME
   ============================================================ */
function newGame() {
  if (!confirm("Démarrer une nouvelle partie ? La partie en cours sera perdue.")) return;
  stopTimer();
  clearSave();
  S = freshState();
  render();
}

function renderResume(saved) {
  const c = el("div", { class: "screen center" });
  c.appendChild(el("div", { class: "spacer" }));
  c.appendChild(el("h1", { class: "logo" }, "Time's Down"));
  c.appendChild(el("p", {}, "Une partie est en cours sur cet appareil."));
  c.appendChild(el("div", { class: "card btn-stack" },
    el("button", {
      onclick: () => {
        S = saved;
        // never resume directly into a running timer / countdown
        if (S.screen === "playing" || S.screen === "countdown") {
          rollbackTurn();
          S.paused = false;
          S.screen = "turnReady";
        }
        save();
        render();
      }
    }, icon("play", 18), " Reprendre la partie"),
    el("button", { class: "ghost", onclick: () => { clearSave(); S = freshState(); render(); } },
      icon("rotate-ccw", 16), " Nouvelle partie")
  ));
  c.appendChild(el("div", { class: "spacer" }));
  return c;
}

/* ---------- misc ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* ============================================================
   ROUTER
   ============================================================ */
function render() {
  const app = $("#app");
  app.innerHTML = "";
  let view;
  switch (S.screen) {
    case "setup":         view = renderSetup(); break;
    case "teams":         view = renderTeams(); break;
    case "wordEntryForm": view = renderWordEntryForm(); break;
    case "turnReady":     view = renderTurnReady(); break;
    case "countdown":     view = renderCountdown(); break;
    case "playing":       view = renderPlaying(); break;
    case "turnRecap":     view = renderTurnRecap(); break;
    case "gameOver":      view = renderGameOver(); break;
    default:              S.screen = "setup"; view = renderSetup();
  }
  app.appendChild(view);
  if (typeof lucide !== "undefined") lucide.createIcons();
  if (S.screen === "playing" && !S.paused) updateTimerUI();
  app.scrollTop = 0;
}

/* ---------- PWA (inline manifest + icon, no asset files) ---------- */
function setupPWA() {
  try {
    const svg =
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>" +
      "<rect width='512' height='512' rx='112' fill='#241657'/>" +
      "<rect x='40' y='40' width='432' height='432' rx='84' fill='none' stroke='#ffd23f' stroke-width='16'/>" +
      "<text x='256' y='338' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' " +
      "font-size='248' font-weight='700' text-anchor='middle' fill='#ffd23f'>TD</text></svg>";
    const iconUri = "data:image/svg+xml," + encodeURIComponent(svg);

    const appleLink = document.getElementById("apple-icon-link");
    if (appleLink) appleLink.href = iconUri;

    const manifest = {
      name: "Time's Down",
      short_name: "Time's Down",
      description: "Le jeu de mots à se passer entre amis.",
      start_url: ".",
      scope: ".",
      display: "standalone",
      orientation: "portrait",
      background_color: "#140d33",
      theme_color: "#140d33",
      icons: [
        { src: iconUri, sizes: "any", type: "image/svg+xml", purpose: "any" },
        { src: iconUri, sizes: "any", type: "image/svg+xml", purpose: "maskable" }
      ]
    };
    const mLink = document.getElementById("manifest-link");
    if (mLink) {
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      mLink.href = URL.createObjectURL(blob);
    }
  } catch (e) {}
}

/* ---------- boot ---------- */
(function boot() {
  setupPWA();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
  const saved = load();
  if (saved && saved.screen && saved.screen !== "setup") {
    const app = $("#app");
    app.appendChild(renderResume(saved));
  } else {
    S = saved && saved.screen === "setup" ? saved : freshState();
    render();
  }
})();
</script>
