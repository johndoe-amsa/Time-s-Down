<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1140">
<title>Time's Down — Jeu de mots</title>
<style>
  :root {
    --bg: #1b1140;
    --bg2: #261760;
    --card: #2f1f73;
    --card2: #3b2a8c;
    --accent: #ffd23f;
    --good: #2ecc71;
    --bad: #ff5c7a;
    --neutral: #6c7bff;
    --text: #f4f1ff;
    --muted: #b5addf;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 1.9rem; margin: 6px 0 2px; letter-spacing: .5px; }
  h2 { font-size: 1.35rem; margin: 0 0 12px; }
  h3 { font-size: 1.05rem; margin: 0 0 8px; }
  p  { line-height: 1.45; color: var(--muted); }
  .tagline { color: var(--accent); font-weight: 600; margin: 0 0 18px; }
  .screen { animation: fade .25s ease; flex: 1; display: flex; flex-direction: column; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: var(--radius);
    padding: 18px;
    margin: 0 0 14px;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 13px 14px;
    font-size: 1rem;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.22);
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 46px; height: 46px; font-size: 1.4rem; padding: 0;
    flex: none; border-radius: 12px;
  }
  .stepper .val { font-size: 1.3rem; font-weight: 700; min-width: 46px; text-align: center; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 14px;
    padding: 15px 18px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1b1140;
    background: var(--accent);
    width: 100%;
    transition: transform .06s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.secondary { background: var(--card2); color: var(--text); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,.15); }
  button.good { background: var(--good); color: #06351c; }
  button.bad  { background: var(--bad);  color: #46091b; }
  button.neutral { background: var(--neutral); color: #fff; }
  button.small { width: auto; padding: 9px 14px; font-size: .9rem; }
  .btn-stack > button { margin-top: 10px; }
  .btn-stack > button:first-child { margin-top: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    font-size: .8rem; font-weight: 700;
    background: rgba(255,255,255,.1); color: var(--text);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; }

  .player-line {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 13px; background: rgba(0,0,0,.18);
    border-radius: 12px; margin-bottom: 8px;
  }
  .player-line .name { flex: 1; font-weight: 600; }
  .player-line button { width: auto; flex: none; }
  .x-btn {
    background: transparent; color: var(--bad);
    width: 34px; height: 34px; padding: 0; font-size: 1.2rem;
  }

  .team-block { margin-bottom: 12px; }
  .team-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .team-head input { font-weight: 700; }
  .team-members { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 6px 11px; border-radius: 999px; font-size: .85rem;
    background: rgba(255,255,255,.09); font-weight: 600;
  }

  .center { text-align: center; }
  .big-num { font-size: 4.2rem; font-weight: 800; line-height: 1; }
  .timer { font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--bad); animation: pulse .8s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .word-box {
    background: linear-gradient(160deg, var(--card2), var(--card));
    border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    margin: 14px 0;
    min-height: 150px;
    display: flex; align-items: center; justify-content: center;
  }
  .word-box .word { font-size: 2.3rem; font-weight: 800; word-break: break-word; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 6px; }
  .stat {
    flex: 1; background: rgba(0,0,0,.2); border-radius: 12px;
    padding: 10px; text-align: center;
  }
  .stat .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 1.5rem; font-weight: 800; }

  .recap-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(0,0,0,.18); margin-bottom: 8px;
  }
  .recap-item .w { flex: 1; font-weight: 600; }
  .recap-item.removed .w { text-decoration: line-through; color: var(--muted); }

  .score-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .score-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table .s { text-align: right; font-weight: 800; font-size: 1.25rem; }
  .winner-banner {
    text-align: center; padding: 22px; border-radius: var(--radius);
    background: linear-gradient(160deg, var(--accent), #ffb800);
    color: #1b1140; font-weight: 800; font-size: 1.4rem; margin-bottom: 14px;
  }
  .hint { font-size: .9rem; color: var(--muted); margin-top: 8px; }
  .footer-note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: auto; padding-top: 18px; }
  .spacer { flex: 1; }
  .err { color: var(--bad); font-size: .9rem; margin: 6px 0 0; min-height: 1.1em; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   Time's Down — jeu de mots local (un seul appareil)
   3 manches : description libre, un seul mot, mime.
   ============================================================ */

const STORAGE_KEY = "timesdown_state_v1";
const TEAM_COLORS = ["#ff5c7a", "#6c7bff", "#2ecc71", "#ffd23f", "#ff9f43", "#26d0ce"];
const ROUNDS = [
  { name: "Description libre", rule: "Fais deviner le mot en l'expliquant avec tes propres mots. Interdit : dire le mot ou un mot de la même famille." },
  { name: "Un seul mot",       rule: "Tu n'as droit qu'à UN SEUL mot pour faire deviner. Pas de geste, pas de bruitage." },
  { name: "Mime",              rule: "Aucune parole : tu dois faire deviner uniquement en mimant." },
];

/* ---------- State ---------- */
let S = null;

function freshState() {
  return {
    screen: "setup",
    players: [],            // [{id, name}]
    nbTeams: 2,
    teams: [],              // [{id, name, color, playerIds:[], score, descPtr}]
    wordsPerPlayer: 5,
    turnSeconds: 30,
    words: [],              // [{id, text}]
    // word entry
    entryIndex: 0,          // index into players for the entry gate
    // round / turn
    roundIndex: 0,
    roundRemaining: [],     // wordIds still to guess this round
    pile: [],               // shuffled working order for current turn
    currentWordId: null,
    turnFound: [],           // wordIds found during the current turn
    snapshots: [],           // undo stack (JSON strings) for current turn
    teamPos: 0,              // index into teams = team currently playing
    timeLeft: 0,
    roundJustFinished: false,
  };
}

/* ---------- Persistence ---------- */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s && typeof s === "object" && s.screen) return s;
  } catch (e) {}
  return null;
}
function clearSave() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

/* ---------- Helpers ---------- */
let _id = 1;
const uid = () => "i" + (_id++) + Date.now().toString(36);
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k === "html") n.innerHTML = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else if (props[k] !== false && props[k] != null) n.setAttribute(k, props[k]);
  }
  for (const kid of kids) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function wordText(id) { const w = S.words.find(x => x.id === id); return w ? w.text : "?"; }
function playerName(id) { const p = S.players.find(x => x.id === id); return p ? p.name : "?"; }
function currentTeam() { return S.teams[S.teamPos]; }
function currentDescriberId() {
  const t = currentTeam();
  return t.playerIds[t.descPtr % t.playerIds.length];
}

/* ---------- Timer ---------- */
let timerHandle = null;
function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    S.timeLeft--;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      stopTimer();
      vibrate([120, 60, 120]);
      endTurn(false);
    } else {
      save();
      const t = $("#timer");
      if (t) {
        t.textContent = S.timeLeft;
        t.classList.toggle("low", S.timeLeft <= 10);
      }
    }
  }, 1000);
}

/* ============================================================
   SETUP
   ============================================================ */
function addPlayer(name) {
  const n = (name || "").trim();
  if (!n) return false;
  S.players.push({ id: uid(), name: n });
  return true;
}
function buildTeams() {
  const nb = Math.max(2, Math.min(S.nbTeams, S.players.length));
  const order = shuffle(S.players.map(p => p.id));
  const teams = [];
  for (let i = 0; i < nb; i++) {
    teams.push({
      id: uid(),
      name: "Équipe " + (i + 1),
      color: TEAM_COLORS[i % TEAM_COLORS.length],
      playerIds: [],
      score: 0,
      descPtr: 0,
    });
  }
  order.forEach((pid, i) => teams[i % nb].playerIds.push(pid));
  S.teams = teams;
}

function renderSetup() {
  const c = el("div", { class: "screen" });
  c.appendChild(el("h1", {}, "Time's Down"));
  c.appendChild(el("p", { class: "tagline" }, "Le jeu de mots à se passer entre amis"));

  /* Players */
  const pCard = el("div", { class: "card" });
  pCard.appendChild(el("h3", {}, "Joueurs (" + S.players.length + ")"));
  S.players.forEach(p => {
    pCard.appendChild(el("div", { class: "player-line" },
      el("span", { class: "name" }, p.name),
      el("button", { class: "x-btn", onclick: () => { S.players = S.players.filter(x => x.id !== p.id); save(); render(); } }, "✕")
    ));
  });
  const inp = el("input", { type: "text", placeholder: "Nom du joueur", autocomplete: "off" });
  const addErr = el("p", { class: "err" });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
  function doAdd() {
    if (addPlayer(inp.value)) { inp.value = ""; save(); render(); setTimeout(() => { const i = $("#app input[type=text]"); if (i) i.focus(); }, 0); }
    else { addErr.textContent = "Entre un nom."; }
  }
  pCard.appendChild(el("div", { class: "row", style: "margin-top:6px" },
    inp,
    el("button", { class: "secondary", style: "flex:none;width:auto;padding:13px 18px", onclick: doAdd }, "Ajouter")
  ));
  pCard.appendChild(addErr);
  c.appendChild(pCard);

  /* Settings */
  const sCard = el("div", { class: "card" });
  sCard.appendChild(el("h3", {}, "Réglages"));
  sCard.appendChild(stepper("Nombre d'équipes", S.nbTeams, 2, Math.max(2, S.players.length || 2),
    v => { S.nbTeams = v; save(); render(); }));
  sCard.appendChild(stepper("Mots par joueur", S.wordsPerPlayer, 1, 12,
    v => { S.wordsPerPlayer = v; save(); render(); }));
  sCard.appendChild(stepper("Secondes par tour", S.turnSeconds, 15, 120,
    v => { S.turnSeconds = v; save(); render(); }, 5));
  c.appendChild(sCard);

  /* Validation + start */
  const need = [];
  if (S.players.length < 2) need.push("Ajoute au moins 2 joueurs.");
  if (S.players.length < S.nbTeams) need.push("Il faut au moins autant de joueurs que d'équipes.");
  const startCard = el("div", { class: "card" });
  if (need.length) {
    startCard.appendChild(el("p", { class: "hint" }, need.join(" ")));
  } else {
    const total = S.players.length * S.wordsPerPlayer;
    startCard.appendChild(el("p", { class: "hint" },
      total + " mots au total · " + S.nbTeams + " équipes · " + S.turnSeconds + "s par tour"));
  }
  startCard.appendChild(el("button", {
    disabled: need.length > 0,
    onclick: () => {
      buildTeams();
      S.words = [];
      S.entryIndex = 0;
      S.screen = "teams";
      save(); render();
    }
  }, "Former les équipes →"));
  c.appendChild(startCard);

  c.appendChild(el("p", { class: "footer-note" }, "Tout reste sur cet appareil. Passez-le de main en main."));
  return c;
}

function stepper(labelTxt, value, min, max, onChange, step) {
  step = step || 1;
  const wrap = el("div", { style: "margin-bottom:14px" });
  wrap.appendChild(el("label", {}, labelTxt));
  const valEl = el("span", { class: "val" }, String(value));
  wrap.appendChild(el("div", { class: "stepper" },
    el("button", { class: "secondary", onclick: () => onChange(Math.max(min, value - step)) }, "−"),
    valEl,
    el("button", { class: "secondary", onclick: () => onChange(Math.min(max, value + step)) }, "+"),
    el("span", { class: "hint", style: "margin-left:10px" }, "(" + min + "–" + max + ")")
  ));
  return wrap;
}

/* ============================================================
   TEAM REVIEW (after random draw)
   ============================================================ */
function renderTeams() {
  const c = el("div", { class: "screen" });
  c.appendChild(el("h2", {}, "Les équipes"));
  c.appendChild(el("p", {}, "Tirage au sort effectué. Tu peux renommer une équipe ou relancer le tirage."));

  S.teams.forEach(t => {
    const block = el("div", { class: "card team-block" });
    const nameInput = el("input", { type: "text", value: t.name });
    nameInput.addEventListener("input", e => { t.name = e.target.value; save(); });
    block.appendChild(el("div", { class: "team-head" },
      el("span", { class: "dot", style: "background:" + t.color }),
      nameInput
    ));
    const members = el("div", { class: "team-members" });
    t.playerIds.forEach(pid => members.appendChild(el("span", { class: "chip" }, playerName(pid))));
    block.appendChild(members);
    c.appendChild(block);
  });

  c.appendChild(el("div", { class: "card btn-stack" },
    el("button", { class: "secondary", onclick: () => { buildTeams(); save(); render(); } }, "↻ Relancer le tirage"),
    el("button", { onclick: () => { S.screen = "wordEntryGate"; S.entryIndex = 0; save(); render(); } },
      "Passer à la saisie des mots →"),
    el("button", { class: "ghost", onclick: () => { S.screen = "setup"; save(); render(); } }, "← Retour aux réglages")
  ));
  return c;
}

/* ============================================================
   WORD ENTRY (private, pass the phone)
   ============================================================ */
function renderWordEntryGate() {
  const p = S.players[S.entryIndex];
  const c = el("div", { class: "screen center" });
  c.appendChild(el("div", { class: "spacer" }));
  c.appendChild(el("h2", {}, "Passe le téléphone à"));
  c.appendChild(el("div", { class: "big-num", style: "font-size:2.6rem;color:var(--accent);margin:6px 0 14px" }, p.name));
  c.appendChild(el("p", {}, "Personne d'autre ne doit voir l'écran. Quand " + p.name + " a le téléphone en main, c'est parti."));
  c.appendChild(el("div", { class: "card" },
    el("p", { class: "hint", style: "margin:0 0 12px" },
      "Joueur " + (S.entryIndex + 1) + " / " + S.players.length +
      " · " + S.wordsPerPlayer + " mots à saisir"),
    el("button", { onclick: () => { S.screen = "wordEntryForm"; save(); render(); } },
      "Je suis " + p.name + ", c'est parti →")
  ));
  c.appendChild(el("div", { class: "spacer" }));
  return c;
}

function renderWordEntryForm() {
  const p = S.players[S.entryIndex];
  const c = el("div", { class: "screen" });
  c.appendChild(el("h2", {}, "À toi, " + p.name));
  c.appendChild(el("p", {}, "Écris " + S.wordsPerPlayer +
    " mots ou expressions. Ils seront mélangés avec ceux des autres — personne ne saura qui a écrit quoi."));

  const inputs = [];
  const card = el("div", { class: "card" });
  for (let i = 0; i < S.wordsPerPlayer; i++) {
    const inp = el("input", {
      type: "text", placeholder: "Mot " + (i + 1), autocomplete: "off",
      autocapitalize: "none", style: "margin-bottom:10px"
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && inputs[i + 1]) inputs[i + 1].focus();
    });
    inputs.push(inp);
    card.appendChild(inp);
  }
  c.appendChild(card);
  const err = el("p", { class: "err" });
  c.appendChild(err);

  c.appendChild(el("button", {
    onclick: () => {
      const vals = inputs.map(i => i.value.trim()).filter(Boolean);
      if (vals.length < S.wordsPerPlayer) {
        err.textContent = "Remplis les " + S.wordsPerPlayer + " mots (" + vals.length + " saisis).";
        return;
      }
      const lower = vals.map(v => v.toLowerCase());
      if (new Set(lower).size !== lower.length) {
        err.textContent = "Tu as écrit deux fois le même mot.";
        return;
      }
      vals.forEach(v => S.words.push({ id: uid(), text: v }));
      S.entryIndex++;
      if (S.entryIndex >= S.players.length) startNewRound(0, true);
      else S.screen = "wordEntryGate";
      save(); render();
    }
  }, "Valider mes mots ✓"));
  setTimeout(() => { if (inputs[0]) inputs[0].focus(); }, 30);
  return c;
}

/* ============================================================
   ROUND / TURN LOGIC
   ============================================================ */
function startNewRound(roundIndex, fromSetup) {
  S.roundIndex = roundIndex;
  S.roundRemaining = shuffle(S.words.map(w => w.id));
  S.roundJustFinished = false;
  // After setup the first team starts; otherwise rotation already advanced.
  if (fromSetup) { S.teamPos = 0; }
  S.screen = "roundIntro";
}

function renderRoundIntro() {
  const r = ROUNDS[S.roundIndex];
  const t = currentTeam();
  const c = el("div", { class: "screen center" });
  c.appendChild(el("div", { class: "spacer" }));
  c.appendChild(el("span", { class: "pill" }, "Manche " + (S.roundIndex + 1) + " / " + ROUNDS.length));
  c.appendChild(el("h1", { style: "margin:14px 0 6px" }, r.name));
  c.appendChild(el("p", { style: "max-width:420px;margin:0 auto 18px" }, r.rule));
  c.appendChild(el("div", { class: "card" },
    el("p", { class: "hint", style: "margin:0 0 4px" }, "C'est l'équipe qui commence :"),
    el("h3", { style: "margin:0", html: '<span class="dot" style="background:' + t.color + ';vertical-align:middle"></span> ' + escapeHtml(t.name) }),
    el("p", { class: "hint", style: "margin:8px 0 0" }, S.words.length + " mots dans la manche")
  ));
  c.appendChild(el("button", { onclick: () => { S.screen = "turnReady"; save(); render(); } },
    "Préparer le tour →"));
  c.appendChild(el("div", { class: "spacer" }));
  return c;
}

function renderTurnReady() {
  const t = currentTeam();
  const describer = playerName(currentDescriberId());
  const r = ROUNDS[S.roundIndex];
  const c = el("div", { class: "screen center" });
  c.appendChild(el("div", { class: "spacer" }));
  c.appendChild(el("span", { class: "pill" }, "Manche " + (S.roundIndex + 1) + " · " + r.name));
  c.appendChild(el("div", { style: "margin:18px 0 4px" },
    el("span", { class: "dot", style: "background:" + t.color + ";width:16px;height:16px" }),
    el("span", { style: "font-weight:800;font-size:1.3rem;margin-left:8px" }, t.name)));
  c.appendChild(el("p", {}, "C'est à"));
  c.appendChild(el("div", { class: "big-num", style: "font-size:2.4rem;color:var(--accent)" }, describer));
  c.appendChild(el("p", {}, "de faire deviner à son équipe."));
  c.appendChild(el("div", { class: "card" },
    el("p", { class: "hint", style: "margin:0 0 4px" }, r.rule),
    el("p", { class: "hint", style: "margin:8px 0 0" },
      S.roundRemaining.length + " mots restants · " + S.turnSeconds + "s")
  ));
  c.appendChild(el("button", { class: "good", onclick: beginTurn }, "▶ JOUER"));
  c.appendChild(el("div", { class: "spacer" }));
  return c;
}

function beginTurn() {
  S.pile = shuffle(S.roundRemaining.slice());
  S.currentWordId = S.pile.length ? S.pile.shift() : null;
  S.turnFound = [];
  S.snapshots = [];
  S.timeLeft = S.turnSeconds;
  S.screen = "playing";
  save();
  render();
  startTimer();
}

function snapshot() {
  S.snapshots.push(JSON.stringify({
    pile: S.pile,
    cur: S.currentWordId,
    rem: S.roundRemaining,
    found: S.turnFound,
  }));
}
function serveNext() {
  S.currentWordId = S.pile.length ? S.pile.shift() : null;
}

function actionFound() {
  if (S.currentWordId == null) return;
  snapshot();
  const id = S.currentWordId;
  S.turnFound.push(id);
  S.roundRemaining = S.roundRemaining.filter(x => x !== id);
  currentTeam().score++;
  vibrate(40);
  serveNext();
  save();
  if (S.currentWordId == null && S.roundRemaining.length === 0) {
    endTurn(true);          // round cleared
  } else {
    updatePlaying();
  }
}
function actionPass() {
  if (S.currentWordId == null) return;
  snapshot();
  S.pile.push(S.currentWordId);
  serveNext();
  save();
  updatePlaying();
}
function actionUndo() {
  if (!S.snapshots.length) return;
  const snap = JSON.parse(S.snapshots.pop());
  // recompute team score from snapshot's found count delta
  const delta = S.turnFound.length - snap.found.length;
  if (delta > 0) currentTeam().score -= delta;
  S.pile = snap.pile;
  S.currentWordId = snap.cur;
  S.roundRemaining = snap.rem;
  S.turnFound = snap.found;
  vibrate(20);
  save();
  updatePlaying();
}

function endTurn(roundCleared) {
  stopTimer();
  S.roundJustFinished = !!roundCleared;
  // an in-progress word that was never resolved stays available next turn
  S.screen = "turnRecap";
  save();
  render();
}

function renderPlaying() {
  const t = currentTeam();
  const c = el("div", { class: "screen" });

  c.appendChild(el("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:6px" },
    el("span", { class: "pill" },
      el("span", { class: "dot", style: "background:" + t.color }),
      el("span", {}, t.name)),
    el("span", { class: "pill" }, "M" + (S.roundIndex + 1) + " · " + ROUNDS[S.roundIndex].name)
  ));

  c.appendChild(el("div", { class: "center" },
    el("span", { id: "timer", class: "big-num timer" + (S.timeLeft <= 10 ? " low" : ""), style: "font-size:3rem" },
      String(S.timeLeft))
  ));

  c.appendChild(el("div", { class: "word-box" },
    el("span", { class: "word", id: "curword" },
      S.currentWordId != null ? wordText(S.currentWordId) : "—")
  ));

  c.appendChild(el("div", { class: "stat-row" },
    stat("Trouvés (ce tour)", S.turnFound.length, "found-stat"),
    stat("Restants", S.roundRemaining.length, "rem-stat")
  ));

  c.appendChild(el("div", { class: "btn-stack" },
    el("button", { class: "good", id: "btn-found", onclick: actionFound }, "✓ TROUVÉ !"),
    el("div", { class: "row" },
      el("button", { class: "neutral", id: "btn-pass", onclick: actionPass }, "↷ Passe"),
      el("button", { class: "secondary", id: "btn-undo", disabled: !S.snapshots.length, onclick: actionUndo }, "↶ Annuler")
    )
  ));
  return c;
}

function stat(k, v, id) {
  return el("div", { class: "stat" },
    el("div", { class: "k" }, k),
    el("div", { class: "v", id: id }, String(v)));
}

// Lightweight in-place update so the timer interval is never disrupted.
function updatePlaying() {
  const w = $("#curword");
  if (w) w.textContent = S.currentWordId != null ? wordText(S.currentWordId) : "—";
  const f = $("#found-stat"); if (f) f.textContent = S.turnFound.length;
  const r = $("#rem-stat");   if (r) r.textContent = S.roundRemaining.length;
  const u = $("#btn-undo");   if (u) u.disabled = !S.snapshots.length;
}

/* ============================================================
   TURN RECAP (with contestation)
   ============================================================ */
function renderTurnRecap() {
  const t = currentTeam();
  const c = el("div", { class: "screen" });
  c.appendChild(el("h2", {}, S.roundJustFinished ? "Manche terminée !" : "Fin du tour"));
  c.appendChild(el("p", {},
    el("span", { class: "pill" },
      el("span", { class: "dot", style: "background:" + t.color }),
      el("span", {}, t.name)),
    document.createTextNode("  a fait deviner " + S.turnFound.length + " mot(s).")
  ));
  c.appendChild(el("p", { class: "hint" },
    "L'équipe adverse conteste un mot ? Retire-le : il ne compte plus et reviendra dans la manche."));

  const list = el("div", { class: "card" });
  if (!S.turnFound.length) {
    list.appendChild(el("p", { class: "hint", style: "margin:0" }, "Aucun mot trouvé ce tour."));
  }
  S.turnFound.forEach(id => {
    const removed = S._removed && S._removed.includes(id);
    const item = el("div", { class: "recap-item" + (removed ? " removed" : "") });
    item.appendChild(el("span", { class: "w" }, wordText(id)));
    item.appendChild(el("button", {
      class: (removed ? "secondary" : "ghost") + " small", style: "width:auto",
      onclick: () => {
        S._removed = S._removed || [];
        if (S._removed.includes(id)) S._removed = S._removed.filter(x => x !== id);
        else S._removed.push(id);
        save(); render();
      }
    }, removed ? "Remettre" : "Retirer"));
    list.appendChild(item);
  });
  c.appendChild(list);

  const removedCount = (S._removed || []).length;
  const netScore = t.score; // already reflects only confirmed; we adjust on continue
  c.appendChild(el("div", { class: "card" },
    el("p", { class: "hint", style: "margin:0 0 10px" },
      "Score validé ce tour : " + (S.turnFound.length - removedCount) +
      (removedCount ? "  (" + removedCount + " retiré(s))" : "")),
    el("button", { onclick: continueAfterRecap },
      S.roundJustFinished
        ? (S.roundIndex + 1 < ROUNDS.length ? "Manche suivante →" : "Voir les scores finaux →")
        : "Au tour suivant →")
  ));
  return c;
}

function continueAfterRecap() {
  // Apply contested removals: refund score, put words back into the round.
  const removed = S._removed || [];
  removed.forEach(id => {
    currentTeam().score--;
    if (!S.roundRemaining.includes(id)) S.roundRemaining.push(id);
  });
  S._removed = [];

  // Advance rotation: this team's describer moves on, next team plays.
  const t = currentTeam();
  t.descPtr = (t.descPtr + 1) % t.playerIds.length;
  S.teamPos = (S.teamPos + 1) % S.teams.length;

  const roundOver = S.roundRemaining.length === 0;
  if (roundOver) {
    if (S.roundIndex + 1 < ROUNDS.length) {
      startNewRound(S.roundIndex + 1, false);
    } else {
      S.screen = "gameOver";
      stopTimer();
    }
  } else {
    S.screen = "turnReady";
  }
  save();
  render();
}

/* ============================================================
   GAME OVER
   ============================================================ */
function renderGameOver() {
  const ranked = S.teams.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter(t => t.score === top);
  const c = el("div", { class: "screen" });

  c.appendChild(el("div", { class: "winner-banner" },
    winners.length > 1
      ? "Égalité ! " + winners.map(w => w.name).join(" & ")
      : "🏆 " + winners[0].name + " gagne !"));

  const table = el("table", { class: "score-table" });
  ranked.forEach((t, i) => {
    table.appendChild(el("tr", {},
      el("td", { html: '<span class="dot" style="background:' + t.color + ';margin-right:8px"></span>' +
        (i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : "") + escapeHtml(t.name) }),
      el("td", { class: "s" }, String(t.score))
    ));
  });
  c.appendChild(el("div", { class: "card" }, el("h3", {}, "Scores finaux"), table));

  c.appendChild(el("div", { class: "card btn-stack" },
    el("button", {
      onclick: () => {
        // replay with same players/teams, fresh words
        const keep = { players: S.players, teams: S.teams, nbTeams: S.nbTeams,
          wordsPerPlayer: S.wordsPerPlayer, turnSeconds: S.turnSeconds };
        S = freshState();
        Object.assign(S, keep);
        S.teams.forEach(t => { t.score = 0; t.descPtr = 0; });
        S.words = []; S.entryIndex = 0; S.screen = "wordEntryGate";
        save(); render();
      }
    }, "Rejouer (mêmes équipes)"),
    el("button", { class: "ghost", onclick: newGame }, "Nouvelle partie")
  ));
  return c;
}

/* ============================================================
   RESUME / NEW GAME
   ============================================================ */
function newGame() {
  if (!confirm("Démarrer une nouvelle partie ? La partie en cours sera perdue.")) return;
  stopTimer();
  clearSave();
  S = freshState();
  render();
}

function renderResume(saved) {
  const c = el("div", { class: "screen center" });
  c.appendChild(el("div", { class: "spacer" }));
  c.appendChild(el("h1", {}, "Time's Down"));
  c.appendChild(el("p", {}, "Une partie est en cours sur cet appareil."));
  c.appendChild(el("div", { class: "card btn-stack" },
    el("button", {
      onclick: () => {
        S = saved;
        // never resume directly into a running timer
        if (S.screen === "playing") S.screen = "turnReady";
        render();
      }
    }, "Reprendre la partie"),
    el("button", { class: "ghost", onclick: () => { clearSave(); S = freshState(); render(); } },
      "Nouvelle partie")
  ));
  c.appendChild(el("div", { class: "spacer" }));
  return c;
}

/* ---------- misc ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* ============================================================
   ROUTER
   ============================================================ */
function render() {
  const app = $("#app");
  app.innerHTML = "";
  let view;
  switch (S.screen) {
    case "setup":          view = renderSetup(); break;
    case "teams":          view = renderTeams(); break;
    case "wordEntryGate":  view = renderWordEntryGate(); break;
    case "wordEntryForm":  view = renderWordEntryForm(); break;
    case "roundIntro":     view = renderRoundIntro(); break;
    case "turnReady":      view = renderTurnReady(); break;
    case "playing":        view = renderPlaying(); break;
    case "turnRecap":      view = renderTurnRecap(); break;
    case "gameOver":       view = renderGameOver(); break;
    default:               S.screen = "setup"; view = renderSetup();
  }
  app.appendChild(view);
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
(function boot() {
  const saved = load();
  if (saved && saved.screen && saved.screen !== "setup") {
    const app = $("#app");
    app.appendChild(renderResume(saved));
  } else {
    S = saved && saved.screen === "setup" ? saved : freshState();
    render();
  }
})();
</script>
</body>
</html>
